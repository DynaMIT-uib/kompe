name: PynaMIT compatibility

on:
  workflow_dispatch:
    inputs:
      pynamit_ref:
        description: PynaMIT branch, tag, or commit
        default: gamera-processing
        required: true
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  pynamit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: kompe
      - uses: actions/checkout@v7
        with:
          repository: DynaMIT-uib/PynaMIT
          ref: ${{ inputs.pynamit_ref || 'gamera-processing' }}
          path: consumer
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ./kompe
      - run: python -m pip install -e "./consumer[plot,mage]" pytest
      - run: python -m pytest -q consumer/tests
