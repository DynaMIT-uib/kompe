name: Consumer CI

on:
  workflow_dispatch:
    inputs:
      pynamit_ref:
        description: PynaMIT branch, tag, or commit
        default: gamera-processing
        required: true
      lompe_ref:
        description: Lompe branch, tag, or commit
        default: main
        required: true
      secsy_ref:
        description: secsy branch, tag, or commit
        default: igrf_secs
        required: true
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  pynamit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kompe
      - uses: actions/checkout@v4
        with:
          repository: DynaMIT-uib/PynaMIT
          ref: ${{ inputs.pynamit_ref || 'gamera-processing' }}
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ./kompe
      - run: python -m pip install -e ./consumer pytest
      - run: pytest -q consumer/tests

  lompe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kompe
      - uses: actions/checkout@v4
        with:
          repository: klaundal/lompe
          ref: ${{ inputs.lompe_ref || 'main' }}
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ./kompe
      - run: python -m pip install -e "./consumer[deps-from-github,dev]"
      - run: pytest -q consumer/tests

  secsy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kompe
      - uses: actions/checkout@v4
        with:
          repository: klaundal/secsy
          ref: ${{ inputs.secsy_ref || 'igrf_secs' }}
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ./kompe
      - run: python -m pip install -e ./consumer pytest
      - run: pytest -q consumer/tests
