[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kompe"
version = "0.1.0"
description = "Operators, meshes, projections, and expansions on spherical surfaces"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Kompe Developers"},
    {name = "Karl M. Laundal"},
]
dependencies = [
    "numpy>=1.26",
    "packaging",
    "scipy>=1.11",
]

[project.optional-dependencies]
jax = ["jax>=0.4.26"]
test = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kompe = ["data/*.npz"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = ["requires_jax: requires the optional JAX backend"]

[tool.ruff]
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
extend-select = ["B", "E", "I", "UP", "W", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/kompe/cubed_sphere/diffutils.py" = ["D", "W291"]
"src/kompe/cubed_sphere/plot.py" = ["B905", "D", "E501", "E701", "UP009", "W291", "W293"]
"src/kompe/cubed_sphere/regional.py" = ["D", "E501", "W291", "W293"]
"src/kompe/cubed_sphere/spherical.py" = ["D", "E501", "E712", "E731", "UP031", "W291"]
"src/kompe/secs/cartesian.py" = ["D", "E501", "W291", "W293"]
"src/kompe/secs/kernels.py" = ["D", "E501", "W291", "W293"]
"tests/*.py" = ["D"]
